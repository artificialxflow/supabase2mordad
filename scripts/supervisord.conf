[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[program:auth]
command=/usr/local/bin/auth
directory=/
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rest]
command=/usr/local/bin/postgrest
directory=/
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:meta]
command=node dist/server/server.js
directory=/opt/postgres-meta
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:studio]
command=/bin/bash -c "if [ -f apps/studio/server.js ]; then exec node apps/studio/server.js; elif [ -f server.js ]; then exec node server.js; else exec npx next start -H 0.0.0.0 -p 3000; fi"
directory=/opt/studio
autostart=true
autorestart=true
priority=40
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=50
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:healthlog]
command=/bin/bash -c "sleep 15; while true; do node -e \"require('http').get('http://127.0.0.1:8000/auth/v1/health',r=>{console.log('[health] /auth/v1/health',r.statusCode);process.exit(0)}).on('error',e=>{console.log('[health] FAIL',e.message);process.exit(0)})\"; sleep 30; done"
autostart=true
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
